<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Moon Lite's Footwear</title>
  <meta name="description" content="Reach Moon Lite's Footwear on WhatsApp, phone or email. Store address, opening hours and enquiries.">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;0,6..96,700;1,6..96,500&family=Jost:wght@400;500;600&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/moonlite.css">
</head>
<body data-page="contact">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" data-chrome="header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="wrap">
        <p class="breadcrumb"><a href="index.html">Home</a> / Contact</p>
        <h1>Let's <em>talk</em> shoes.</h1>
        <p>Questions about sizing, stock or delivery? We're quickest on WhatsApp — but reach us however suits you.</p>
      </div>
    </section>

    <section class="section" style="padding-top:1rem">
      <div class="wrap contact-grid">
        <div data-reveal>
          <div class="info-list" data-contact-info></div>
          <h3 style="font-family:var(--util);text-transform:uppercase;letter-spacing:.14em;font-size:var(--step--1);margin:2rem 0 .8rem">Opening hours</h3>
          <div class="hours" data-contact-hours></div>
        </div>

        <div data-reveal>
          <form data-contact-form>
            <div class="field">
              <label for="cf-name">Your name</label>
              <input id="cf-name" name="name" type="text" autocomplete="name" placeholder="e.g. Ada">
            </div>
            <div class="field">
              <label for="cf-msg">How can we help?</label>
              <textarea id="cf-msg" name="message" rows="5" placeholder="Ask about a pair, your size, delivery to your area…"></textarea>
            </div>
            <button class="btn btn--gold btn--block" type="submit">Send on WhatsApp</button>
            <p class="cart-note" style="margin-top:.9rem">This opens WhatsApp with your message ready to send — no account needed.</p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" data-chrome="footer"></footer>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/products.seed.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/pages.js"></script>
  <script>
    (function () {
      var C = window.MOONLITE_CONFIG || {}, I = window.ML_ICON || {};
      var wa = "https://wa.me/" + (C.whatsappNumber || "").replace(/\D/g, "");
      var rows = [
        ["wa", "WhatsApp", C.phoneDisplay || "Chat with us", wa, true],
        ["ig", "Phone", C.phoneDisplay || "", "tel:" + (C.phoneDisplay || "").replace(/\s/g, ""), false, "phone"],
        ["fb", "Email", C.email || "", "mailto:" + (C.email || ""), false, "email"],
        ["ig", "Visit us", C.address || "", C.mapsUrl || "#", true, "pin"]
      ];
      var pin = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
      var phone = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.4 2.1L8.1 9.9a16 16 0 0 0 6 6l1.2-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2z"/></svg>';
      var email = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 6L2 7"/></svg>';
      var icons = { pin: pin, phone: phone, email: email, wa: I.wa || pin };
      var host = document.querySelector("[data-contact-info]");
      if (host) {
        host.innerHTML = rows.filter(function (r) { return r[2]; }).map(function (r) {
          var ic = icons[r[5]] || I.wa || pin;
          var ext = r[4] ? ' target="_blank" rel="noopener"' : "";
          return '<div class="info-item">' + ic + '<div><h3>' + r[1] + '</h3><a href="' + r[3] + '"' + ext + '>' + r[2] + '</a></div></div>';
        }).join("");
      }
      var hostH = document.querySelector("[data-contact-hours]");
      if (hostH && C.hours) hostH.innerHTML = C.hours.map(function (h) {
        return '<div><span>' + h.day + '</span><span>' + h.time + '</span></div>';
      }).join("");
    })();
  </script>
</body>
</html>
